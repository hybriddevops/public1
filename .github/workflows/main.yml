---
name: OpenServiceNowChangeRequestGate

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      short_description:
        description: 'Change short description'
        required: true
        default: 'Manual Change Request'
      description:
        description: 'Change description'
        required: true
        default: 'Manual change request opened via GitHub Actions'

jobs:
  # ── Job 1: Create the CR — no environment gate here ──────────────────
  openChange:
    name: Open ServiceNow Change Request
    runs-on: ubuntu-latest
    outputs:
      change-number: ${{ steps.create.outputs.change-request-number }}
      change-sys-id: ${{ steps.create.outputs.change-request-sys-id }}
    steps:
      - name: Open ServiceNow Change Request
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        id: create
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Open ServiceNow Change Request
          change-request: '{"attributes":{"requested_by":{"name": "System Administrator"},"assignment_group":{"name": "Change Management"},"priority": "2","comments": "This is a sample pipeline script to be added in your change step","work_notes": "Update this to work_notes","start_date": "2026-06-04 22:57:59","end_date": "2026-06-04 22:59:59","Model":{"name":"devopsVelocity"}}'
#          change-request: >
#            {
#              "setCloseCode": "true",
#              "autoCloseChange": true,
#              "attributes": {
#                "short_description": "Pipeline test",
#                "description": "Pipeline Test",
#                "assignment_group": "a715cd759f2002002920bde8132e7018",
#                "implementation_plan": "Manual change executed via GitHub Actions.",
#                "backout_plan": "Revert manually if required.",
#                "test_plan": "Verify change outcome manually.",
#                "change_model" : {"name":"devopsVelocity"}
#              }
#            }
#          interval: '100'
#          timeout: '3600'
          deployment-gate: '{"environment":"deployment_gate", "jobName":"Deploy"}'
            
#      - name: Output Change Details
#        run: |
#          echo "============================================"
#          echo " Change Number : ${{ steps.create.outputs.change-request-number }}"
#          echo " Sys ID        : ${{ steps.create.outputs.change-request-sys-id }}"
#          echo "============================================"
#          if [ -z "${{ steps.create.outputs.change-request-number }}" ]; then
#            echo "ERROR: No change number returned — aborting"
#            exit 1
#          fi
#
  # ── Job 2: Gate — SN approves this when CR hits Implement state ───────
  Deploy:
    name: Deploy
    needs: openChange
    runs-on: ubuntu-latest
    environment: deployment_gate   # ✅ correct place for the gate
                                   # SN App must be a protection rule here
    steps:
      - name: Run Deployment Scripts
        run: |
          echo "Change ${{ needs.openChange.outputs.change-number }} approved"
          echo "Completed Deployment"
