---
name: OpenServiceNowChangeRequestGate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - Development
          - Staging
          - deployment_gate    
      short_description:
        description: 'Change short description'
        required: true
        default: 'Manual Change Request'
      description:
        description: 'Change description'
        required: true
        default: 'Manual change request opened via GitHub Actions'

jobs:
  # ── Job 1: Create CR — blocks only until CR is confirmed created ──────
  openChange:
    name: OpenServiceNowChangeRequestGate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      change-number: ${{ steps.create.outputs.change-request-number }}
      change-sys-id: ${{ steps.create.outputs.change-request-sys-id }}
    steps:
      - name: Open ServiceNow Change Request - Gate
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        id: create
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Open ServiceNow Change Request GATE'
          change-request: >
            {
              "setCloseCode": "true",
              "autoCloseChange": true,
              "attributes": {
                "short_description": "${{ github.event.inputs.short_description }}",
                "description": "${{ github.event.inputs.description }}",
                "assignment_group": "a715cd759f2002002920bde8132e7018",
                "implementation_plan": "Manual change executed via GitHub Actions.",
                "backout_plan": "Revert manually if required.",
                "test_plan": "Verify change outcome manually."
              }
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Confirm Change Created
        run: |
          echo "============================================"
          echo " Change Number : ${{ steps.create.outputs.change-request-number }}"
          echo " Sys ID        : ${{ steps.create.outputs.change-request-sys-id }}"
          echo "============================================"


